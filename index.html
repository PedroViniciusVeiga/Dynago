<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e23">
<meta name="description" content="Registro rápido de treinos na academia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dynago">
<title>Dynago</title>
<style>
:root{color-scheme:dark;--bg:#1b1e23;--card:#25292f;--card2:#30353c;--line:#3c424a;--tx:#f1f3f5;--mu:#9ba3ad;--ac:#FF3B47;--ac-tx:#ffffff;--or:#ff6b6b;--bl:#3D8BFF;--ye:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 96px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:14px;cursor:pointer}
button:active{transform:scale(.97)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
html,button,a,input,select,label{touch-action:manipulation}button{-webkit-user-select:none;user-select:none}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}.logo svg{flex-shrink:0}.logo b{color:var(--ac)}
.mu{color:var(--mu)}.sm{font-size:13px}
.days{display:flex;gap:4px;margin-bottom:16px}
.chip{flex:1 1 0;min-width:0;padding:10px 0;font-weight:700;font-size:13px;background:var(--card);border-radius:12px;position:relative}
.chip small{display:block;font-size:11px;font-weight:600;opacity:.65;margin-top:2px}
.chip.on{background:var(--ac);color:var(--ac-tx)}
.dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--bl)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.mini{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;max-width:150px;flex-shrink:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.ex{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exrow{cursor:pointer}
.num{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--bl)}
.cta{width:100%;padding:18px;font-size:18px;font-weight:800;background:var(--ac);color:var(--ac-tx);border-radius:16px}
.ghost{display:block;width:100%;padding:14px;font-weight:600;border:1px dashed var(--line);background:transparent;border-radius:14px;text-align:center;cursor:pointer}
.lnk{background:none;color:var(--bl);font-weight:700;padding:12px 4px;font-size:14px;border-radius:8px}
.warn{background:#3a2629;border:1px solid var(--or);color:#ffb7b0;border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
.tag{font-size:12px;color:var(--or);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#1b1e23ee;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
.nav div{max-width:480px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;padding:16px;font-size:14px;font-weight:600;border-radius:0;color:var(--mu)}
.nav button.on{color:var(--ac)}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;color:var(--bl)}
.bar{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--ac));transition:width .3s}
.badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;letter-spacing:.4px;white-space:nowrap}
.set{display:grid;grid-template-columns:1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.set.cur{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.row{display:flex;gap:8px;align-items:stretch}
.fld{flex:1;display:flex;align-items:center;background:var(--card2);border-radius:14px;overflow:hidden;min-width:0}
.fld button{width:44px;align-self:stretch;font-size:24px;background:none;color:var(--bl);border-radius:0}
.fld div{flex:1;text-align:center;min-width:0}
.fld input{width:100%;background:none;border:0;color:var(--tx);font-size:30px;font-weight:800;text-align:center;padding:8px 0 0;outline:0;font-family:inherit}
.fld small{display:block;color:var(--mu);font-size:11px;padding-bottom:6px}
.ok{width:64px;font-size:28px;background:var(--card2);color:var(--mu)}
.foot{position:fixed;left:0;right:0;bottom:0;background:#1b1e23f2;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.foot>div{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot .nx{flex:1;min-width:0}
.foot .nx p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot button.go{padding:16px 20px;font-weight:800;background:var(--ac);color:var(--ac-tx)}
.foot button.go.dim{background:var(--card2);color:var(--tx)}
.hint{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hint button.badge{padding:9px 12px;font-size:12px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.delta{color:var(--bl);font-weight:700}.neg{color:var(--or)}
.stat{display:flex;gap:10px;margin-bottom:12px}.stat .card{flex:1;margin:0;text-align:center}
.stat b{display:block;font-size:24px;color:var(--bl)}
.vid{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;aspect-ratio:16/9;background:linear-gradient(135deg,#30353c,#202328);border:1px dashed var(--line);border-radius:14px;color:var(--mu);text-decoration:none}
.vid span{width:56px;height:56px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.vid span:after{content:"";border-left:16px solid var(--ac-tx);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.dn{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;opacity:.7;cursor:pointer}
.eq{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}.eq button{padding:4px 9px;font-size:11px;background:none;color:var(--mu);border-radius:0}.eq button.on{background:var(--card2);color:var(--tx)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:16px;outline:0;min-width:0}
.inp:focus{border-color:var(--bl)}
.inp.big{font-size:20px;font-weight:800}
.dgrid{display:flex;gap:4px;margin-top:8px}
.dchip{flex:1;padding:10px 0;font-size:12px;font-weight:700;background:var(--card2);color:var(--mu);border-radius:10px}
.dchip.on{background:var(--ac);color:var(--ac-tx)}
.lbl{display:flex;gap:8px;margin-top:18px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);transition:opacity .15s}
.trow:first-of-type{border-top:0}
.trow.off .badge,.trow.off input{opacity:.4}
.step{display:flex;align-items:center;background:var(--card2);border-radius:12px;overflow:hidden;width:120px;flex-shrink:0}
.step button{width:44px;height:46px;background:none;color:var(--bl);font-size:22px;border-radius:0}
.step b{flex:1;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.trow input{width:72px;flex-shrink:0;text-align:center;padding:12px 4px}
.sumy{background:var(--card2);border-radius:12px;padding:10px 12px;margin:14px 0}
.ctp{padding:10px 12px;font-size:13px;font-weight:700;background:var(--card2);color:var(--mu);border-radius:10px}
.ctp.on{background:var(--bl);color:#fff}
.cdn{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#3D8BFF26;color:var(--bl);display:grid;place-items:center;font-weight:800;font-size:12px}
.okt{font-size:12px;font-weight:700;color:var(--bl)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}.fchips::-webkit-scrollbar{display:none}
.fchips .chip{flex:0 0 auto;padding:10px 14px}
.xbtn{width:44px;height:44px;flex-shrink:0;background:var(--card2);color:var(--mu);font-size:22px;border-radius:12px}
.cf{position:fixed;inset:0;background:#000c;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.cfb{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:360px}
.av{width:40px;height:40px;border-radius:50%;background:var(--card2);color:var(--tx);font-weight:800;font-size:14px;display:grid;place-items:center;flex-shrink:0;border:2px solid var(--bl)}
.auth{min-height:calc(100vh - 32px);display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.tgl{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex-shrink:0;padding:0}.tgl i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}.tgl.on{background:var(--bl)}.tgl.on i{left:23px}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var TY={WU:['WARM UP','#8ecbff',.5],FS:['FEEDER SET','#3D8BFF',.75],WS:['WORK SET','#ff8f87',1],TS:['TOP SET','#FF3B47',1],RS:['DESCANSO','#9ba3ad',0]};
var KS=['WU','FS','WS','TS','RS'],ST=['WU','FS','WS','TS'];
var DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],DL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],ORD=[1,2,3,4,5,6,0];
var DEF='WU12 FS10 WS10 WS10 TS';
var PRESC={'Supino Inclinado no Smith':'WU15 FS12 WS10 WS10 TS','Desenvolvimento no Smith':'WU15 FS12 WS10 WS10 TS','Crucifixo na Polia':'FS12 WS12 WS12 TS','Tríceps Francês c/ Corda':'FS12 WS12 WS12 TS','Remada Curvada na Máquina Aberta':'WU15 FS12 WS10 WS10 TS','Puxada Alta Aberta':'WU15 FS12 WS10 WS10 TS','Remada Pull Down c/ Barra':'FS12 WS10 WS10 TS','Rosca Bíceps na Polia':'FS12 WS12 WS12 TS','Agachamento no Smith':'WU15 FS12 WS8 WS8 TS','Elevação Pélvica':'WU15 FS12 WS10 WS10 TS','Stiff c/ Barra':'WU15 FS12 WS10 WS10 TS','Mesa Flexora':'FS12 WS12 WS12 TS','Supino Inclinado Máquina':'WU15 FS12 WS10 WS10 TS','Remada Serrote':'FS12 WS10 WS10 TS','Tríceps Padrão na Polia':'FS12 WS12 WS12 TS','Rosca Bíceps Banco Declinado':'FS12 WS10 WS10 TS','Elevação Lateral c/ Halteres':'FS15 WS12 WS12 TS','Leg Press':'WU15 FS12 WS10 WS10 TS','RDL c/ Halteres':'WU15 FS12 WS10 WS10 TS','Cadeira Extensora':'FS12 WS12 WS12 TS'};
function P2(p){return p.split(' ').map(function(t){var m=t.match(/^(WU|FS|WS|TS)(\d*)$/);return[m[1],m[2]?+m[2]:'F']})}
function rp(v){v=String(v).trim();return /^f|falha/i.test(v)?'F':/\d\s*[-–]\s*\d/.test(v)?v.replace(/\s/g,'').replace('–','-'):(parseInt(v)||'F')}
function E(n){return{n:n,s:P2(PRESC[n]||DEF)}}
function W(d,n,t,ex,warn){return{id:'b'+d,days:[d],n:n,t:t,warn:warn||'',ex:ex.map(function(x){return E(x)})}}
var BASE=[
W(1,'Treino B','Peito e Tríceps',['Supino Inclinado no Smith','Desenvolvimento no Smith','Crucifixo na Polia','Tríceps Francês c/ Corda']),
W(2,'Treino A','Costas e Bíceps',['Remada Curvada na Máquina Aberta','Puxada Alta Aberta','Remada Pull Down c/ Barra','Rosca Bíceps na Polia']),
W(3,'Treino C','Inferiores 1',['Agachamento no Smith','Elevação Pélvica','Stiff c/ Barra','Mesa Flexora'],'Mobilidade inicial: faça 5 min de ativação de quadril, tornozelo e glúteo antes da primeira série.'),
W(4,'Treino D','Superiores Completo',['Supino Inclinado Máquina','Remada Serrote','Tríceps Padrão na Polia','Rosca Bíceps Banco Declinado','Elevação Lateral c/ Halteres']),
W(5,'Treino E','Inferiores 2',['Leg Press','RDL c/ Halteres','Elevação Pélvica','Cadeira Extensora'])];
function ld(k,f){try{var v=localStorage.getItem(ukey(k));return v?JSON.parse(v):f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(ukey(k),JSON.stringify(v))}catch(e){}if(DK[k])queueSync()}
function clone(o){return JSON.parse(JSON.stringify(o))}
var plan=[];
function svplan(){sv('gp_plan',plan)}
var CF=null;
function ask(t,sub,ok,fn,safe){CF={t:t,s:sub,ok:ok,fn:fn,safe:safe};R()}
function note(t,sub){CF={t:t,s:sub||'',ok:null,fn:null};R()}
function cfOk(){var f=CF&&CF.fn;CF=null;if(f)f();else R()}
function cfv(){return '<div class="cf" onclick="if(event.target==this){CF=null;R()}"><div class="cfb"><h3 style="font-size:19px">'+esc(CF.t)+'</h3>'+(CF.s?'<p class="mu" style="margin-top:8px;font-size:15px;line-height:1.4">'+esc(CF.s)+'</p>':'')+'<div class="row" style="margin-top:20px">'+
(CF.ok?'<button style="flex:1;padding:16px;font-weight:700" onclick="CF=null;R()">Cancelar</button><button style="flex:1;padding:16px;font-weight:800;background:'+(CF.safe?'var(--ac)':'var(--or)')+';color:#fff" onclick="cfOk()">'+esc(CF.ok)+'</button>':'<button style="flex:1;padding:16px;font-weight:800;background:var(--ac);color:var(--ac-tx)" onclick="cfOk()">OK</button>')+'</div></div></div>'}
var hist=[];
var today=new Date().getDay(),sel=today,tab='today',S=null,M=null,tmr=null,RT=null;
function wOf(d){for(var i=0;i<plan.length;i++)if(plan[i].days.indexOf(d)>=0)return plan[i];return null}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function eqd(n){return /halter/i.test(n)?'H':'B'}
function rnd(x){return Math.round(x/2.5)*2.5}
function fmt(s){var m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function nex(n){return n+(n==1?' exercício':' exercícios')}
function mark(h){var w=Math.round(h*61/46);return '<svg viewBox="-2 9 61 46" width="'+w+'" height="'+h+'" aria-hidden="true"><path fill="#FF3B47" d="M-1 54 H4.4 L9.7 25 H4.3 Z"/><path fill="#3D8BFF" d="M8 54 H17 L25 10 H16 Z"/><path fill="#AEB4BD" fill-rule="evenodd" d="M28 10 H36 A22 22 0 0 1 36 54 H20 L21.8 44 H35 A12 12 0 0 0 35 20 H26.2 Z"/></svg>'}
function rtxt(r){return r=='F'?'falha':r}
function pres(e){return e.s.map(function(g){return g[0]+' '+rtxt(g[1])}).join(' · ')}
function badge(t){var x=TY[t];return '<span class="badge" style="background:'+x[1]+'22;color:'+x[1]+'">'+x[0]+'</span>'}
function short(n){var s=String(n).replace(/^treino\s*/i,'').trim();return s.length<=3?s:s.slice(0,3)}
function $(id){return document.getElementById(id)}
function last(n,eq){for(var i=hist.length-1;i>=0;i--){var e=hist[i].ex.find(function(x){return x.n==n&&(!eq||!x.eq||x.eq==eq)});if(e){var b=e.sets.filter(function(s){return s[0]=='WS'||s[0]=='TS'}).pop()||e.sets.filter(function(s){return s[0]!='RS'}).pop();if(b)return[b[1],b[2],true]}}return[0,10,false]}

/* ---------- contas (Supabase) ---------- */
var CFG=window.DYNAGO_CONFIG||{},SB=null,U=null,AU={m:'login'},SYNC={t:null,st:'ok'},REC=/type=recovery/.test(location.hash||'');
var DK={gp_plan:1,gp_hist:1,gp_vid:1};
function ukey(k){return U&&DK[k]?'dy_'+U.id+'_'+k:k}
function put(k,v){try{localStorage.setItem(ukey(k),JSON.stringify(v))}catch(e){}}
function cfgOk(){return !!(CFG.supabaseUrl&&CFG.supabaseAnonKey)}
function here(){return location.origin+location.pathname}
function uOf(u){var m=u.user_metadata||{};return{id:u.id,email:u.email||'',name:m.name||(u.email||'').split('@')[0]}}
function setUser(u){U=u;if(!u.demo){try{localStorage.setItem('dy_last',JSON.stringify(u))}catch(e){}}plan=ld('gp_plan',[]);hist=ld('gp_hist',[]);tab='today';sel=today;S=null;M=null;HO={};var a=loadAct();if(a){S=a;startTick()}}
function dkey(){return 'dy_'+U.id+'_dirty'}
function dirty(v){try{if(v)localStorage.setItem(dkey(),'1');else localStorage.removeItem(dkey())}catch(e){}}
function isDirty(){try{return !!(U&&localStorage.getItem(dkey()))}catch(e){return false}}
function queueSync(){if(!U||U.demo)return;dirty(1);clearTimeout(SYNC.t);SYNC.t=setTimeout(pushCloud,1200)}
async function pushCloud(){if(!U||U.demo||!SB)return false;var uid=U.id;
try{var r=await SB.from('user_data').upsert({user_id:uid,plan:plan,hist:hist,vids:ld('gp_vid',{}),updated_at:new Date().toISOString()});if(r.error)throw r.error;if(U&&U.id==uid)dirty(0);SYNC.st='ok';return true}catch(e){SYNC.st='off';return false}}
async function pullCloud(){if(!U||U.demo||!SB)return;
if(isDirty()){await pushCloud();return}
try{var r=await SB.from('user_data').select('plan,hist,vids').eq('user_id',U.id).maybeSingle();if(r.error)throw r.error;
if(r.data){plan=r.data.plan||[];hist=r.data.hist||[];put('gp_plan',plan);put('gp_hist',hist);put('gp_vid',r.data.vids||{})}else await pushCloud();
SYNC.st='ok'}catch(e){SYNC.st='off'}
if(!S)R()}
window.addEventListener('online',function(){if(isDirty())pushCloud()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState=='visible'&&isDirty())pushCloud()});
async function boot(){
if(cfgOk()&&window.supabase){SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
SB.auth.onAuthStateChange(function(ev){if(ev=='PASSWORD_RECOVERY'){REC=true;U=null;AU={m:'newpass'};R()}});
var s=null;try{s=(await SB.auth.getSession()).data.session}catch(e){}
if(REC){U=null;AU={m:'newpass'};R();return}
if(s){setUser(uOf(s.user));R();pullCloud()}else R();return}
if(cfgOk()){var l=null;try{l=JSON.parse(localStorage.getItem('dy_last'))}catch(e){}if(l){setUser(l);SYNC.st='off'}}
R()}
function trErr(er){var m=String(er&&er.message||er||'');
if(/invalid login/i.test(m))return 'E-mail ou senha incorretos.';
if(/not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar. Veja sua caixa de entrada (e o spam).';
if(/already registered|already exists/i.test(m))return 'Já existe uma conta com este e-mail.';
if(/password.*(6|characters)|at least 6/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
if(/rate limit|too many|security purposes/i.test(m))return 'Muitas tentativas seguidas. Espere um pouco e tente de novo.';
if(/fetch|network|failed to/i.test(m))return 'Sem conexão. Verifique a internet e tente de novo.';
if(/same.*password|different from the old/i.test(m))return 'A nova senha precisa ser diferente da anterior.';
return 'Não foi possível concluir: '+m}
function amode(m){AU={m:m,e:AU.e||'',n:AU.n||''};R()}
async function doAuth(){var m=AU.m,e=String(AU.e||'').trim(),p=String(AU.p||''),n=String(AU.n||'').trim();
if(!SB){AU.err='O login ainda não foi configurado neste endereço.';R();return}
if(m!='newpass'&&!/^\S+@\S+\.\S+$/.test(e)){AU.err='Informe um e-mail válido.';R();return}
if(m=='signup'&&!n){AU.err='Informe seu nome.';R();return}
if(m!='forgot'&&p.length<6){AU.err='A senha precisa ter pelo menos 6 caracteres.';R();return}
AU.err='';AU.busy=true;R();

[0,'Supino Reto com Barra','Barra','Deitado no banco, desça a barra controlada até a linha média do peito, com os cotovelos a cerca de 45° do tronco, e empurre até estender os braços. Mantenha as escápulas retraídas e os pés firmes no chão.'],

[0,'Crucifixo com Halteres','Halteres','Deitado no banco, abra os braços em arco com os cotovelos levemente flexionados até sentir o alongamento do peito. Suba pelo mesmo arco, sem transformar em supino.'],

[0,'Flexão de Braço','Peso corporal','Mãos um pouco mais abertas que os ombros e corpo alinhado da cabeça aos pés. Desça até o peito quase tocar o chão e empurre de volta, sem deixar o quadril cair.'],
[0,'Paralelas para Peito','Peso corporal','Nas barras paralelas, incline o tronco à frente e desça flexionando os cotovelos até sentir o alongamento do peito. Empurre de volta sem travar os cotovelos.'],

[1,'Remada Curvada na Máquina Aberta','Máquina','Peito apoiado na máquina e pegada aberta. Puxe levando os cotovelos para fora e para trás, aperte as escápulas no final e volte até alongar as costas.'],
[1,'Remada Serrote','Halter','Uma mão e um joelho apoiados no banco, costas retas. Puxe o halter em direção ao quadril com o cotovelo próximo ao corpo e desça até alongar a dorsal.'],
[1,'Remada Baixa Sentada','Polia','Sentado, coluna neutra e peito para cima. Puxe o triângulo até o abdômen aproximando as escápulas, sem jogar o tronco para trás, e volte devagar.'],

[1,'Levantamento Terra','Barra','Barra próxima às canelas, coluna neutra. Empurre o chão com as pernas e estenda o quadril mantendo a barra colada ao corpo. Desça pelo mesmo caminho, sem arredondar as costas.'],
[2,'Desenvolvimento no Smith','Smith','Sentado com o banco quase vertical, barra na altura do queixo. Empurre para cima até quase estender os braços e desça controlando, sem arquear demais a lombar.'],
[2,'Desenvolvimento com Halteres','Halteres','Sentado, halteres na altura das orelhas e cotovelos levemente à frente do corpo. Empurre para cima aproximando os halteres e desça devagar até a posição inicial.'],
[2,'Elevação Lateral c/ Halteres','Halteres','Em pé, braços ao lado do corpo e cotovelos levemente flexionados. Eleve os halteres para os lados até a altura dos ombros, sem balançar o tronco, e desça devagar.'],
[2,'Elevação Lateral na Polia','Polia','De lado para a polia baixa, puxe o cabo cruzando à frente do corpo e eleve o braço até a altura do ombro. A polia mantém a tensão o movimento inteiro.'],
[2,'Elevação Frontal','Halteres','Eleve os halteres à frente do corpo até a altura dos ombros, com os cotovelos levemente flexionados, e desça controlando sem embalar.'],
[2,'Crucifixo Inverso na Máquina','Máquina','De frente para o encosto do voador, abra os braços para trás na altura dos ombros. Trabalha o deltoide posterior; evite puxar com o trapézio.'],
[2,'Face Pull','Polia','Corda na polia na altura do rosto. Puxe em direção ao rosto abrindo os cotovelos e girando as mãos para fora no final. Ótimo para deltoide posterior e postura.'],
[2,'Encolhimento com Halteres','Halteres','Em pé com os halteres ao lado do corpo, eleve os ombros em direção às orelhas, segure um instante e desça devagar. Não gire os ombros.'],

[3,'Rosca Bíceps Banco Declinado','Halteres','Com o corpo apoiado no banco e os braços estendidos para baixo, flexione os cotovelos sem mover os ombros. A posição alonga o bíceps no início do movimento; use carga moderada.'],
[3,'Rosca Scott','Barra W','Braços apoiados no banco Scott. Flexione até a contração máxima e desça devagar, sem estender completamente de forma brusca no final.'],
[3,'Rosca Concentrada','Halter','Sentado, cotovelo apoiado na parte interna da coxa. Flexione o braço levando o halter ao ombro e desça devagar, isolando o bíceps.'],

[4,'Mergulho no Banco','Peso corporal','Mãos apoiadas no banco atrás do corpo. Desça flexionando os cotovelos até cerca de 90° e empurre de volta, mantendo o tronco próximo ao banco.'],

if(HF.v=='e')return h+exView(F);
var g=[],cur=null;F.slice().reverse().forEach(function(o){var ws=wstart(o.h.date).getTime();if(!cur||cur.ws!=ws){cur={ws:ws,l:[]};g.push(cur)}cur.l.push(o)});
return h+g.map(function(gr){return '<div style="display:flex;justify-content:space-between;margin:16px 0 8px"><b class="sm">'+wlabel(new Date(gr.ws))+'</b><span class="mu sm">'+gr.l.length+' registro'+(gr.l.length>1?'s':'')+'</span></div><div class="card" style="padding:4px 14px">'+gr.l.map(sessRow).join('')+'</div>'}).join('')}
function sessRow(o){var s=o.h,i=o.i,d=new Date(s.date),op=HO['s'+i],c=s.cardio;
var r='<div class="ex exrow" onclick="hop(\'s'+i+'\')"><div style="width:40px;text-align:center;flex-shrink:0"><b style="font-size:18px;display:block">'+d.getDate()+'</b><span class="mu" style="font-size:11px">'+DN[d.getDay()]+'</span></div>'+
'<div style="flex:1;min-width:0"><p style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c?'Cardio · '+c.type:String(s.name).split(' — ')[0])+'</p><p class="mu sm">'+(c?c.min+' min · '+c.kcal+' kcal':Math.round(s.dur/60)+' min · '+nex(s.ex.length)+' · '+kg(s.vol)+' kg')+'</p></div>'+(c?'':'<span class="mu" style="font-size:18px">'+(op?'−':'+')+'</span>')+'</div>';
if(op&&!c)r+='<div style="padding:0 0 12px 52px">'+s.ex.map(function(e){var t=topSet(e.sets),p=prevTop(i,e.n),hl=e.eq=='H';
return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><span class="sm" style="font-weight:600">'+esc(e.n)+'</span><span class="sm" style="white-space:nowrap">'+(t?'<b>'+kg(t[1])+' kg</b> × '+t[2]+(hl?' /halter':''):'')+'</span></div>'+
'<div style="display:flex;justify-content:space-between;gap:8px;margin-top:3px"><span class="mu" style="font-size:12px">'+e.sets.filter(function(x){return x[0]!='RS'}).map(function(x){return x[0]+' '+kg(x[1])+'×'+x[2]}).join(' · ')+'</span><span style="font-size:12px;white-space:nowrap">'+(t&&p?dtag(t[1]-p[1]):'')+'</span></div></div>'}).join('')+'</div>';
return r}
function exView(F){var X={};F.forEach(function(o){if(o.h.cardio)return;o.h.ex.forEach(function(e){var t=topSet(e.sets);if(!t)return;(X[e.n]=X[e.n]||[]).push({d:o.h.date,w:t[1],r:t[2],hl:e.eq=='H'})})});
var names=Object.keys(X).sort(function(a,b){return new Date(X[b][X[b].length-1].d)-new Date(X[a][X[a].length-1].d)});
if(!names.length)return '<div class="card mu">Nenhum exercício de musculação neste período.</div>';
return '<p class="mu sm" style="margin:4px 0 8px">Maior carga de trabalho por sessão. Toque para ver a evolução.</p><div class="card" style="padding:4px 14px">'+names.map(function(n){var a=X[n],l=a[a.length-1],f=a[0],op=HO['e'+n],mx=Math.max.apply(null,a.map(function(x){return x.w}))||1;
var r='<div class="ex exrow" onclick="hop(\'e'+esc(n).replace(/'/g,"\\'")+'\')"><div style="flex:1;min-width:0"><p style="font-weight:600">'+esc(n)+'</p><p class="mu sm">'+a.length+' sess'+(a.length>1?'ões':'ão')+(a.length>1?' · '+dtag(l.w-f.w)+' no período':'')+'</p></div><div style="text-align:right;flex-shrink:0"><b>'+kg(l.w)+' kg</b><p class="mu sm">× '+l.r+(l.hl?' /halter':'')+'</p></div></div>';
if(op)r+='<div style="padding:4px 0 14px">'+a.slice().reverse().map(function(x){var d=new Date(x.d);return '<div style="display:flex;align-items:center;gap:10px;padding:5px 0"><span class="mu sm" style="width:52px;flex-shrink:0">'+d.getDate()+' '+MS[d.getMonth()]+'</span><div style="flex:1;height:8px;background:var(--card2);border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:'+Math.max(6,x.w/mx*100)+'%;background:var(--ac);border-radius:6px"></i></div><span class="sm" style="width:84px;text-align:right;flex-shrink:0">'+kg(x.w)+' kg × '+x.r+'</span></div>'}).join('')+'</div>';
return r}).join('')+'</div>'}

boot();
if('serviceWorker' in navigator&&location.protocol=='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
